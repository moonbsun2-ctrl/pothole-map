<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Road Repair Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; }
  #map { height: 100%; }
  #info {
    position: absolute; z-index: 1000; top: 10px; left: 50px; right: 10px;
    max-width: 340px; background: rgba(255,255,255,0.95); padding: 8px 12px;
    border-radius: 6px; font: 14px/1.5 sans-serif; box-shadow: 0 1px 5px rgba(0,0,0,0.3);
  }
  #err { color: #b00020; }
  #info label { display: block; }
</style>
</head>
<body>
<div id="info">
  <b>Live Road Repair Map</b><br>
  <span id="status">Connecting...</span><br>
  Potholes: <span id="np">0</span> / Speed bumps: <span id="nb">0</span><br>
  <label><input type="checkbox" id="showtest" checked> Show test events</label>
  <label><input type="checkbox" id="follow" checked> Move to new events</label>
  <div id="err"></div>
  <div id="tilemsg" style="color:#b00020"></div>
</div>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
<script>
function $(id) { return document.getElementById(id); }

var firebaseConfig = {
  apiKey: "AIzaSyAHI84U3RBBJcECRk8r7XI3DqtbNE87HAk",
  authDomain: "pothole-map-b9230.firebaseapp.com",
  projectId: "pothole-map-b9230",
  storageBucket: "pothole-map-b9230.firebasestorage.app",
  messagingSenderId: "927772375520",
  appId: "1:927772375520:web:444f805586acbeef4cd385",
  measurementId: "G-1C66EPZEC0"
};

var map = L.map('map');
var VKEY = '4E085859-98BE-41F4-9D99-99F543CB4F0D';
var vAttr = '&copy; 국토교통부 VWorld';
function vtile(layer, ext) {
  return L.tileLayer('https://api.vworld.kr/req/wmts/1.0.0/' + VKEY + '/' + layer + '/{z}/{y}/{x}.' + ext, {
    minZoom: 6, maxZoom: 19, maxNativeZoom: 18, attribution: vAttr
  });
}
var baseMap = vtile('Base', 'png').addTo(map);
var satMap = vtile('Satellite', 'jpeg');
var hybridMap = vtile('Hybrid', 'png');
map.setMinZoom(6);
baseMap.on('tileerror', function () {
  $('tilemsg').textContent = 'Base map tiles failed to load. Check the VWorld key / registered URL.';
});
baseMap.on('tileload', function () { $('tilemsg').textContent = ''; });
map.setView([36.5, 127.8], 7);

var potholes = L.layerGroup().addTo(map);
var bumps = L.layerGroup().addTo(map);
L.control.layers({
  '일반지도': baseMap,
  '위성지도': satMap
}, {
  '지명 표시 (위성지도용)': hybridMap,
  'Pothole (red)': potholes,
  'Speed bump (gray)': bumps
}, { collapsed: true }).addTo(map);

var markers = {};       // 문서 id -> { marker, group, isTest }
var initialLoaded = false;

function showError(msg) { $('err').textContent = msg; }

function makePopup(d, when) {
  var box = document.createElement('div');
  function line(text, bold) {
    var el = document.createElement(bold ? 'b' : 'span');
    el.textContent = text;
    box.appendChild(el);
    box.appendChild(document.createElement('br'));
  }
  line((d.type === 'pothole' ? 'Pothole (repair needed)' : 'Speed bump (reference)')
       + (d.test ? ' [TEST]' : ''), true);
  line('Time: ' + when);
  line('Impact: ' + d.peak + ' m/s\u00b2, jerk ' + d.jerk);
  line('Lat/Lon: ' + d.lat.toFixed(5) + ', ' + d.lon.toFixed(5));
  return box;
}

function whenText(d) {
  if (d.createdAt && typeof d.createdAt.toDate === 'function') {
    return d.createdAt.toDate().toLocaleString();
  }
  return String(d.clientTime || '');
}

function validDoc(d) {
  return d && typeof d.lat === 'number' && typeof d.lon === 'number' &&
         d.lat >= -90 && d.lat <= 90 && d.lon >= -180 && d.lon <= 180 &&
         (d.type === 'pothole' || d.type === 'speed_bump');
}

function addMarker(id, d, isNew) {
  if (!validDoc(d)) { return; }
  var isPothole = (d.type === 'pothole');
  var marker = L.circleMarker([d.lat, d.lon], {
    radius: isPothole ? 9 : 6,
    color: isPothole ? '#b00020' : '#555555',
    fillColor: isPothole ? '#e53935' : '#9e9e9e',
    fillOpacity: 0.85,
    weight: d.test ? 1 : 2,
    dashArray: d.test ? '3 3' : null
  });
  marker.bindPopup(makePopup(d, whenText(d)));
  var group = isPothole ? potholes : bumps;
  var isTest = !!d.test;
  if (!(isTest && !$('showtest').checked)) { marker.addTo(group); }
  markers[id] = { marker: marker, group: group, isTest: isTest };

  if (isNew && $('follow').checked) {
    map.setView([d.lat, d.lon], Math.max(map.getZoom(), 16));
    marker.openPopup();
  }
}

function removeMarker(id) {
  var m = markers[id];
  if (m) { m.group.removeLayer(m.marker); delete markers[id]; }
}

function updateCounts() {
  var np = 0, nb = 0;
  Object.keys(markers).forEach(function (id) {
    var m = markers[id];
    if (m.isTest && !$('showtest').checked) { return; }
    if (m.group === potholes) { np++; } else { nb++; }
  });
  $('np').textContent = np;
  $('nb').textContent = nb;
}

$('showtest').addEventListener('change', function () {
  Object.keys(markers).forEach(function (id) {
    var m = markers[id];
    if (!m.isTest) { return; }
    if ($('showtest').checked) { m.marker.addTo(m.group); }
    else { m.group.removeLayer(m.marker); }
  });
  updateCounts();
});

function start() {
  if (typeof firebase === 'undefined' || typeof firebase.firestore !== 'function') {
    $('status').textContent = 'Offline';
    showError('Firebase library did not load (network blocked?)');
    return;
  }
  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (e) {}

  db.collection('events').orderBy('createdAt', 'desc').limit(200).onSnapshot(function (snap) {
    snap.docChanges().forEach(function (ch) {
      var id = ch.doc.id;
      if (ch.type === 'added') { addMarker(id, ch.doc.data(), initialLoaded); }
      else if (ch.type === 'modified') { removeMarker(id); addMarker(id, ch.doc.data(), false); }
      else if (ch.type === 'removed') { removeMarker(id); }
    });

    if (!initialLoaded) {
      initialLoaded = true;
      var pts = Object.keys(markers).map(function (id) { return markers[id].marker.getLatLng(); });
      if (pts.length > 0) { map.fitBounds(L.latLngBounds(pts), { padding: [60, 60], maxZoom: 16 }); }
    }
    updateCounts();
    $('status').textContent = 'Live (updated ' + new Date().toLocaleTimeString() + ')';
    showError('');
  }, function (err) {
    $('status').textContent = 'Error';
    showError('Listen failed: ' + err.message);
  });
}

try { start(); } catch (e) { showError('Start error: ' + e.message); }
</script>
</body>
</html>
